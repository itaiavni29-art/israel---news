# One long-running job that scans every 3 minutes for ~5.5 hours, publishing after every scan.
# GitHub's own cron is unreliable (runs are often skipped or delayed by hours), so:
#   • the job starts its successor when it ends (workflow_dispatch via the built-in token), and
#   • an hourly cron and any push to this file act as backups. `concurrency` keeps only one job
#     running and at most one waiting, so nothing overlaps.
# State between jobs (events, ETags) and the published events.json live in the `data` branch.
name: סריקת חדשות

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/scan.yml', 'scripts/scan-loop.js', 'src/**', 'config.json']
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: news-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Cache the embedding model (~130 MB, downloaded once)
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('config.json') }}
          restore-keys: models-

      - name: Restore previous state from the data branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C data
          else
            echo "No data branch yet — first run starts fresh."
          fi

      - name: Scan every few minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/scan-loop.js data 330

      - name: Start the next job
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run scan.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
