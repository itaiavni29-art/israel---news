# Temporary: verifies that a job can start its own successor with the built-in token
# (the same mechanism scan.yml uses). Runs once on push, dispatches itself once, then stops.
name: chain-test

on:
  push:
    branches: [main]
    paths: ['.github/workflows/chain-test.yml']
  workflow_dispatch:
    inputs:
      depth:
        default: '0'

permissions:
  contents: read
  actions: write

jobs:
  hop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "depth=${{ inputs.depth || '0' }}"
      - name: Start the next job (once)
        if: ${{ (inputs.depth || '0') == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run chain-test.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f depth=1
